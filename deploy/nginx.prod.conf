# 生产 Nginx 配置(单实例):所有流量反代到 backend:8000
# 后端同时伺服 API(/api/*)与前端静态页(js/css/pages 挂载在后端 StaticFiles)。
#
# 测试期:直接 http://<服务器IP> 访问即可(当前生效段)。
# 正式期:换上域名后,取消底部 443 段注释并挂载证书,HTTP 301 跳 HTTPS。

upstream edc_backend { server backend:8000; }

server {
    listen 80;
    server_name _;   # 有域名后填真实域名,如 edc.example-hospital.cn

    # 知情同意扫描件上传上限
    client_max_body_size 20m;

    # 文本资源压缩(页面为原生 JS,压缩收益明显)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://edc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传/导出的长请求
        proxy_read_timeout 120s;
    }
}

