<!-- 知情同意页 -->
<div class="max-w-4xl mx-auto">
  <div class="flex items-center justify-between mb-4">
    <div>
      <div class="text-sm text-gray-400" id="consent-patient-info">请选择患者</div>
    </div>
    <div id="consent-status-badge" class="hidden text-xs px-2.5 py-1 rounded-full bg-green-100 text-green-700 font-medium">已签署</div>
  </div>
  <div class="mb-4">
    <label class="text-xs font-medium text-gray-600 block mb-1.5">选择患者</label>
    <select id="cs-patient-select" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="ConsentPage.onPatientSelect()">
      <option value="">加载中...</option>
    </select>
  </div>

  <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
    <div class="text-base font-semibold text-gray-800 mb-1">知情同意书</div>
    <div class="text-xs text-gray-400 mb-4">方案名称："三一照护 + 周制剂" 模式下周制剂降糖药的药物经济性与临床价值研究</div>
    <div class="bg-blue-50 text-blue-700 text-xs px-4 py-2 rounded-lg mb-5">本系统记录知情同意完成情况，纸质原件须另行留存。如需上传扫描件请使用下方上传区。</div>
    <div class="space-y-5">
      <div>
        <div class="text-sm font-semibold text-gray-700 mb-3">受试者信息</div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="text-xs text-gray-500 mb-1 block">知情同意书版本号</label><input id="cs-version" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400" placeholder="如 V1.0"/></div>
          <div><label class="text-xs text-gray-500 mb-1 block">患者编号</label><input id="cs-subject-code" type="text" readonly class="w-full border border-gray-100 bg-gray-50 rounded-lg px-3 py-2 text-sm text-gray-500"/></div>
          <div><label class="text-xs text-gray-500 mb-1 block">受试者联系方式</label><input id="cs-subject-contact" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"/></div>
          <div><label class="text-xs text-gray-500 mb-1 block">知情同意日期 <span class="text-red-400">*</span></label><input id="cs-subject-date" type="date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"/></div>
        </div>
      </div>
      <div>
        <div class="text-sm font-semibold text-gray-700 mb-3">法定代理人（如适用）</div>
        <div class="grid grid-cols-3 gap-4">
          <div><label class="text-xs text-gray-500 mb-1 block">法定代理人姓名</label><input id="cs-proxy-name" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400" placeholder="如适用填写"/></div>
          <div><label class="text-xs text-gray-500 mb-1 block">联系方式</label><input id="cs-proxy-contact" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"/></div>
          <div><label class="text-xs text-gray-500 mb-1 block">签署日期</label><input id="cs-proxy-date" type="date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"/></div>
        </div>
      </div>
      <div>
        <div class="text-sm font-semibold text-gray-700 mb-3">独立见证人（如适用）</div>
        <div class="grid grid-cols-3 gap-4">
          <div><label class="text-xs text-gray-500 mb-1 block">见证人姓名</label><input id="cs-witness-name" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400" placeholder="如适用填写"/></div>
          <div><label class="text-xs text-gray-500 mb-1 block">联系方式</label><input id="cs-witness-contact" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"/></div>
          <div><label class="text-xs text-gray-500 mb-1 block">签署日期</label><input id="cs-witness-date" type="date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"/></div>
        </div>
      </div>
      <div>
        <div class="text-sm font-semibold text-gray-700 mb-3">研究者信息</div>
        <div class="grid grid-cols-3 gap-4">
          <div><label class="text-xs text-gray-500 mb-1 block">研究者姓名</label><input id="cs-inv-name" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400" placeholder="研究者姓名"/></div>
          <div><label class="text-xs text-gray-500 mb-1 block">联系方式</label><input id="cs-inv-contact" type="text" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"/></div>
          <div><label class="text-xs text-gray-500 mb-1 block">签署日期</label><input id="cs-inv-date" type="date" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-400"/></div>
        </div>
      </div>
      <!-- 扫描件上传 -->
      <div>
        <div class="text-sm font-semibold text-gray-700 mb-3">上传纸质签名扫描件</div>
        <label class="cursor-pointer">
          <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-400 hover:bg-blue-50 transition" id="upload-zone">
            <div class="text-gray-400 text-sm mb-1">点击选择文件或拖拽到此处</div>
            <div class="text-gray-300 text-xs">支持 JPG、PNG、PDF，单文件不超过 10MB</div>
            <div id="upload-filename" class="text-blue-600 text-sm mt-2 font-medium"></div>
          </div>
          <input id="cs-file-input" type="file" accept=".jpg,.jpeg,.png,.pdf" class="hidden" onchange="document.getElementById('upload-filename').textContent=this.files[0]?this.files[0].name:''"/>
        </label>
        <div id="cs-uploaded-info" class="hidden mt-3 flex items-center gap-2 text-xs text-green-700 bg-green-50 border border-green-200 rounded-lg px-3 py-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          <span id="cs-uploaded-text">已上传扫描件</span>
        </div>
      </div>
      <div id="cs-error" class="text-red-500 text-xs min-h-4"></div>
      <div class="flex gap-3 mt-2">
        <button id="cs-submit-btn" onclick="ConsentPage.submit()" class="bg-blue-600 text-white text-sm px-6 py-2 rounded-lg hover:bg-blue-700 transition">确认并保存</button>
      </div>
    </div>
  </div>
</div>
